<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="title description">
  <title id="title">X-302-X — do you like pizza?</title>
  <desc id="description">An animated terminal introduces X-302-X with a playful question: Do you like pizza?</desc>
  <defs>
    <clipPath id="command-line">
      <rect x="24" y="54" width="0" height="22">
        <animate attributeName="width" values="0;8.4;16.8;25.2;33.6;42;50.4;58.8;67.2;75.6;84;92.4;100.8;109.2;117.6;126;134.4;142.8" calcMode="discrete" dur="0.85s" begin="0.4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="159" rx="12" fill="#0d1117" stroke="#30363d" />
  <circle cx="26" cy="24" r="6" fill="#ff5f56" />
  <circle cx="46" cy="24" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="24" r="6" fill="#27c93f" />
  <text x="320" y="29" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x-302-x@github:~</text>
  <line x1="0" y1="44" x2="640" y2="44" stroke="#21262d" />

  <!-- Static fallback remains readable when SVG animation is unavailable. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
    <animate attributeName="opacity" values="1;0" begin="0.2s" dur="0.2s" fill="freeze" />
    <text x="24" y="70"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">./icebreaker.sh</tspan></text>
    <text x="24" y="100" fill="#79c0ff">X-302-X</text>
    <text x="24" y="130" fill="#e6edf3">Do you like pizza?</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
    <text x="24" y="70" clip-path="url(#command-line)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">./icebreaker.sh</tspan></text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.35s" dur="0.2s" fill="freeze" />
      <text x="24" y="100" fill="#79c0ff">X-302-X</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.2s" fill="freeze" />
      <text x="24" y="130" fill="#e6edf3">Do you like pizza?</text>
    </g>
  </g>

  <rect x="180" y="117" width="8.4" height="17" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.42;0.58;1" dur="1s" begin="2.35s" repeatCount="indefinite" />
  </rect>
</svg>
